[project]
name = "homelab-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swidjaja6", email = "Swidjaja270@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
homelab-api = "homelab_api:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
