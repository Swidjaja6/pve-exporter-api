name: HL-API Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Install uv
            uses: astral-sh/setup-uv@v6
          - name: Install dependencies
            run: uv sync --frozen 
          - name: Run tests
            run: uv run pytest

    publish:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Docker Login
            uses: docker/login-action@v4
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
          - name: Compute tags
            id: meta                                   # lets later steps read this step's outputs
            uses: docker/metadata-action@v6
            with:
                images: ${{ secrets.DOCKERHUB_USERNAME }}/homelab-api
                tags: |
                    type=sha                               
                    type=raw,value=latest                 

          - name: Build and push
            uses: docker/build-push-action@v7
            with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}     # both tags from the step above
                labels: ${{ steps.meta.outputs.labels }} # adds commit/repo info to the image